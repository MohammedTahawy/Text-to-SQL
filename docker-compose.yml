version: '3.8'

services:
  ai-service:
    build: .
    container_name: executive-ai-service
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis
    networks:
      - executive-network

  redis:
    image: redis:7-alpine
    container_name: executive-ai-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - executive-network

volumes:
  redis_data:

networks:
  executive-network:
    driver: bridge

